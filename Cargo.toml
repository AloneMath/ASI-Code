[package]
name = "asi-code"
version = "0.3.0"
edition = "2021"
authors = ["ASI Code Team"]
description = "ASI Code terminal agent - Rust coding assistant CLI with provider-agnostic workflow"
license = "MIT"
repository = "https://github.com/AloneMath/asi-code"
readme = "README.md"

[[bin]]
name = "asi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls only: reqwest's default `default-tls` would also pull in OpenSSL
# (openssl-sys) on Linux, which needs system dev headers to build.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "charset", "http2", "macos-system-configuration"] }
glob = "0.3"
regex = "1"
sha2 = "0.10"
rpassword = "7.3"
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

# Error handling - keep this as it's useful
thiserror = "1.0"

[target.'cfg(windows)'.dependencies]
# Job Objects contain the whole process tree spawned by the bash tool.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
